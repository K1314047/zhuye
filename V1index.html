
<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">    
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>我的首页</title>
    <meta name="description" content="这里是介绍">
    <style>
        :root {
    --editor-bg: #1e1e1e;
    --line-color: #858585;
    --text-color: #d4d4d4;
    --keyword-color: #569cd6;
    --string-color: #ce9178;
    --comment-color: #6a9955;
    --number-color: #b5cea8;
    --font-family: 'Consolas', 'Monaco', monospace;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background-color: var(--editor-bg);
    color: var(--text-color);
    font-family: var(--font-family);
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.editor {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
    background: var(--editor-bg);
    border-radius: 8px;
    box-shadow: 0 0 20px rgba(0,0,0,0.4);
}

.editor-header {
    background: #2d2d2d;
    padding: 10px;
    border-radius: 8px 8px 0 0;
    display: flex;
    align-items: center;
    gap: 8px;
}

.window-btn {
    width: 12px;
    height: 12px;
    border-radius: 50%;
}

.close { background: #ff5f56; }
.minimize { background: #ffbd2e; }
.maximize { background: #27c93f; }

.title-bar {
    color: #858585;
    margin-left: 20px;
    font-size: 0.9em;
}

.editor-content {
    padding: 20px;
    counter-reset: line;
    font-size: 14px;
    overflow-x: auto;
}

.line {
    display: flex;
    padding: 2px 0;
    position: relative;
    min-height: 1.6em;
}

.line::before {
    counter-increment: line;
    content: counter(line);
    color: var(--line-color);
    width: 2em;
    text-align: right;
    padding-right: 1em;
    position: absolute;
}

.line-content {
    padding-left: 3em;
    width: 100%;
}

.indent { margin-left: 2em; }
.indent-2 { margin-left: 4em; }

.keyword { color: var(--keyword-color); }
.string { color: var(--string-color); }
.comment { color: var(--comment-color); }
.number { color: var(--number-color); }

a {
    color: #4ec9b0;
    text-decoration: none;
    transition: color 0.2s;
}

a:hover {
    color: #66d9cb;
    text-decoration: underline;
}

.cursor {
    display: inline-block;
    width: 2px;
    height: 1.2em;
    background: #fff;
    margin-left: 2px;
    animation: blink 1s step-end infinite;
    vertical-align: middle;
}

@keyframes blink {
    50% { opacity: 0; }
}

@media (max-width: 768px) {
    body {
        padding: 10px;
    }

    .editor {
        width: 100%;
        margin: 0;
        font-size: 14px;
    }

    .editor-content {
        padding: 15px 10px;
    }

    .line-content {
        padding-left: 2.5em;
    }


    .indent { margin-left: 1.5em; }
    .indent-2 { margin-left: 3em; }

    .title-bar {
        font-size: 0.8em;
        margin-left: 10px;
    }

    .window-btn {
        width: 10px;
        height: 10px;
    }
}

@media (max-width: 320px) {
    .editor-content {
        font-size: 12px;
    }

    .indent { margin-left: 1em; }
    .indent-2 { margin-left: 2em; }
}
    </style>
</head>
<body>
    <div class="editor">
        <div class="editor-header">
            <span class="window-btn close"></span>
            <span class="window-btn minimize"></span>
            <span class="window-btn maximize"></span>
            <span class="title-bar">profile.js</span>
        </div>
        <div class="editor-content">
            <div class="line"><div class="line-content"><span class="keyword">const</span> profile = {</div></div>
            <!--这里是个人资料-->
            <div class="line"><div class="line-content indent"><span class="keyword">name</span>: <span class="string">"G.Ark"</span>,</div></div>
            <div class="line"><div class="line-content indent-2"><span class="keyword">title</span>: <span class="string"><a href="https://001100.best" target="_blank">"Web3黑奴探险"</a></span>,</div></div>
            <div class="line"><div class="line-content indent"><span class="keyword">contact</span>: {</div></div>
            <div class="line"><div class="line-content indent-2"><span class="keyword">email</span>: <span class="string">"<a href="/">ii@outlook.com.au</a>"</span>,</div></div>
            <div class="line"><div class="line-content indent">},</div></div>
            <!--这里是链接-->
            <div class="line"><div class="line-content indent"><span class="keyword">links</span>: {</div></div>
            <div class="line"><div class="line-content indent-2"><span class="keyword">blog</span>: <span class="string"><a href="https://blog.001100.best/" target="_blank">"/blog"</a></span>,</div></div>
            <div class="line"><div class="line-content indent-2"><span class="keyword">Twitter</span>: <span class="string"><a href="https://x.com/ayig61" target="_blank">"@ayig61
"</a></span>,</div></div>
            <div class="line"><div class="line-content indent-2"><span class="keyword">Telegam</span>: <span class="string"><a href="https://t.me/ayig61_bot" target="_blank">"@ayig61_bot"</a></span>,</div></div>
            <div class="line"><div class="line-content indent">},</div></div>
            <div class="line"><div class="line-content indent"><span class="keyword">copyright</span>: <span class="string">2024-<span id="year">2025</span> "</span></div></div>
            <div class="line"><div class="line-content">}<span class="cursor"></span></div></div>
        </div>
    </div>
</body>
</html>
